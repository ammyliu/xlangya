name: Verify and publish six episodes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/assemble-video.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble six videos and verify every checksum
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, hashlib
          manifest = json.loads(Path('videos/manifest.json').read_text())
          assert len(manifest['episodes']) == 6
          lines = []
          for i, item in enumerate(manifest['episodes']):
              parts = sorted(Path(f'.video-upload/{i}').glob('part-*'))
              assert len(parts) == (item['bytes'] + 2999999) // 3000000
              data = b''.join(part.read_bytes() for part in parts)
              assert len(data) == item['bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
              output = Path(item['path'])
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
              lines.append(f"{item['sha256']}  {item['path']}")
          Path('videos/verification.txt').write_text('Verified six final episodes, 2026-10-26\n' + '\n'.join(lines) + '\n')
          PYCODE
      - name: Replace previous submission with verified six episodes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch videos/27b76256ed7974f60967ebb01cbcbc1a.mp4
          git rm -r .video-upload
          git add videos
          git commit -m "media: publish six verified episodes from both Canvas projects"
          git push origin HEAD:main
